<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Streaming ASR (faster-whisper)</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem;
      background: radial-gradient(circle at top, #1e3a8a 0%, #0f172a 45%, #020617 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 9999px;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #0f172a;
      background: linear-gradient(135deg, #38bdf8, #22d3ee);
      box-shadow: 0 15px 30px rgba(34, 211, 238, 0.25);
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 18px 36px rgba(56, 189, 248, 0.35);
      filter: brightness(1.05);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 12px 24px rgba(34, 211, 238, 0.3);
      filter: brightness(0.98);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.4;
      box-shadow: none;
    }

    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .panel {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.08);
      border-radius: 1.25rem;
      padding: 1.5rem;
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 45px rgba(15, 23, 42, 0.45);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-height: 0;
    }

    .panel h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(148, 163, 184, 0.9);
    }

    #transcript {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow: hidden;
    }

    #final {
      flex: 1;
      overflow-y: auto;
      padding-right: 0.5rem;
      font-size: clamp(1.05rem, 1.8vw, 1.4rem);
      line-height: 1.6;
      color: #f8fafc;
    }

    #final p {
      margin: 0 0 0.9rem;
      padding: 0.6rem 0.85rem;
      border-radius: 0.9rem;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.2);
      box-shadow: inset 0 1px 0 rgba(148, 197, 255, 0.4);
      white-space: pre-wrap;
    }

    #partial {
      min-height: 2.2rem;
      color: rgba(148, 197, 255, 0.9);
      font-style: italic;
      letter-spacing: 0.01em;
      white-space: pre-wrap;
    }

    #log {
      flex: 1;
      min-height: 200px;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.55);
      border-radius: 0.85rem;
      padding: 1rem;
      margin: 0;
      border: 1px solid rgba(148, 163, 184, 0.12);
      color: rgba(226, 232, 240, 0.85);
      font-size: 0.875rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    @media (max-width: 600px) {
      body {
        padding: 1.5rem 1rem;
      }

      header {
        align-items: flex-start;
      }

      .controls {
        width: 100%;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Streaming ASR (faster-whisper)</h1>
    <div class="controls">
      <button id="start">🎙️ Démarrer</button>
      <button id="stop" disabled>⏹️ Stop</button>
    </div>
  </header>
  <main>
    <section class="panel" id="transcript">
      <h2>Transcription</h2>
      <div id="final" aria-live="polite" aria-label="Transcription finale"></div>
      <div id="partial" aria-live="polite" aria-label="Transcription partielle"></div>
    </section>
    <section class="panel">
      <h2>Diagnostics</h2>
      <pre id="log"></pre>
    </section>
  </main>
  <script type="module" src="/static/client.js"></script>
</body>
</html>
